name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "docs/**"
      - "LICENSE"
      - "NOTICE.txt"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/build_windows.ps1"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Read application version
        shell: pwsh
        run: |
          $version = python -c `
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Nie udało się odczytać wersji aplikacji."
          }
          "POLYSUB_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cu128
          python -m pip install -e ".[local,fasttext,video,build]"
          python -c "import torch; assert torch.version.cuda == '12.8', torch.version.cuda"
          python -m pip cache purge

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Build application and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipDependencyInstall

      - name: Scan EXE and installer with Microsoft Defender
        shell: pwsh
        run: |
          .\scripts\scan_windows_release.ps1 -Paths @(
            ".\dist\PolySubTranslator\PolySubTranslator.exe",
            ".\installer-output\PolySub-Translator-Setup-$env:POLYSUB_VERSION.exe"
          )

      - name: Test EXE — wersja
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--version"

      - name: Test EXE — wideo
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-video"

      - name: Test EXE — wykrywanie sprzętu
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-hardware"

      - name: Test EXE — wydajność CPU
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-performance"

      - name: Test EXE — NVIDIA CUDA
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-nvidia-runtime"

      - name: Test EXE — marka i licencja
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-branding"

      - name: Test EXE — AMD ROCm
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-amd-runtime"

      - name: Test EXE — katalog modeli
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-model-catalog"

      - name: Test EXE — uszkodzony cache modeli
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-model-cache"

      - name: Test EXE — czas napisów
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-subtitle-timing"

      - name: Test EXE — GUI
        shell: pwsh
        run: .\scripts\run_windows_self_test.ps1 ".\dist\PolySubTranslator\PolySubTranslator.exe" "--self-test-gui"

      - name: Install, test and uninstall Setup.exe
        shell: pwsh
        run: |
          $installerName = "PolySub-Translator-Setup-$env:POLYSUB_VERSION.exe"
          $installer = (Resolve-Path ".\installer-output\$installerName").Path
          $installDir = Join-Path `
            $env:RUNNER_TEMP `
            ("PolySub-Install-Test-" + [guid]::NewGuid().ToString("N"))
          $installArguments = `
            "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$installDir`""
          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList $installArguments `
            -PassThru `
            -Wait
          if ($install.ExitCode -ne 0) {
            throw "Instalator zakończył się kodem $($install.ExitCode)."
          }

          $installedExe = Join-Path $installDir "PolySubTranslator.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Instalator nie utworzył PolySubTranslator.exe."
          }
          $installedReadme = Join-Path $installDir "README.txt"
          if (-not (Test-Path $installedReadme)) {
            throw "Instalator nie utworzył README.txt."
          }
          foreach ($requiredFile in @("LICENSE.txt", "NOTICE.txt", "INSTRUKCJA_OBSLUGI.md")) {
            if (-not (Test-Path (Join-Path $installDir $requiredFile))) {
              throw "Instalator nie utworzył pliku $requiredFile."
            }
          }
          foreach ($argument in @(
            "--version",
            "--self-test-video",
            "--self-test-nvidia-runtime",
            "--self-test-branding",
            "--self-test-amd-runtime",
            "--self-test-model-cache",
            "--self-test-gui"
          )) {
            .\scripts\run_windows_self_test.ps1 $installedExe $argument
          }

          $uninstaller = Get-ChildItem `
            -Path $installDir `
            -Filter "unins*.exe" `
            | Select-Object -First 1
          if (-not $uninstaller) {
            throw "Instalator nie utworzył deinstalatora."
          }
          $uninstall = Start-Process `
            -FilePath $uninstaller.FullName `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" `
            -PassThru `
            -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "Deinstalator zakończył się kodem $($uninstall.ExitCode)."
          }

      - name: Create and test installer ZIP
        shell: pwsh
        run: |
          $installerName = "PolySub-Translator-Setup-$env:POLYSUB_VERSION.exe"
          $zipName = "PolySub-Translator-Installer-$env:POLYSUB_VERSION.zip"
          $packageDir = ".\installer-output\PolySub-Translator-Installer-$env:POLYSUB_VERSION"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item ".\installer-output\$installerName" (Join-Path $packageDir $installerName)
          Copy-Item ".\packaging\INSTALLATION.txt" (Join-Path $packageDir "README.txt")
          Copy-Item ".\docs\INSTRUKCJA_OBSLUGI_PL.md" (Join-Path $packageDir "INSTRUKCJA_OBSLUGI.md")
          Copy-Item ".\LICENSE" (Join-Path $packageDir "LICENSE.txt")
          Copy-Item ".\NOTICE.txt" (Join-Path $packageDir "NOTICE.txt")
          Compress-Archive -Path "$packageDir\*" -DestinationPath ".\installer-output\$zipName"

          $testDir = Join-Path $env:RUNNER_TEMP "PolySub-Installer-Zip-Test"
          Expand-Archive -Path ".\installer-output\$zipName" -DestinationPath $testDir -Force
          foreach ($requiredFile in @(
            $installerName,
            "README.txt",
            "INSTRUKCJA_OBSLUGI.md",
            "LICENSE.txt",
            "NOTICE.txt"
          )) {
            if (-not (Test-Path (Join-Path $testDir $requiredFile))) {
              throw "W paczce instalatora brakuje pliku $requiredFile."
            }
          }

      - name: Prepare release files
        shell: pwsh
        run: |
          $releaseFiles = @(
            ".\installer-output\PolySub-Translator-Setup-$env:POLYSUB_VERSION.exe",
            ".\installer-output\PolySub-Translator-Installer-$env:POLYSUB_VERSION.zip"
          )
          $hashes = foreach ($file in $releaseFiles) {
            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($hash.Path))"
          }
          $hashes | Set-Content `
            -Path ".\installer-output\SHA256SUMS.txt" `
            -Encoding ascii

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: PolySub-Translator-Windows
          path: |
            installer-output/PolySub-Translator-Setup-*.exe
            installer-output/PolySub-Translator-Installer-*.zip
            installer-output/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish direct downloads in GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:POLYSUB_VERSION"
          $assets = @(
            ".\installer-output\PolySub-Translator-Setup-$env:POLYSUB_VERSION.exe",
            ".\installer-output\PolySub-Translator-Installer-$env:POLYSUB_VERSION.zip",
            ".\installer-output\SHA256SUMS.txt"
          )

          gh release view $tag --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create `
              $tag `
              $assets `
              --target $env:GITHUB_SHA `
              --title "PolySub Translator $env:POLYSUB_VERSION" `
              --notes-file ".\packaging\RELEASE_NOTES.md" `
              --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Nie udało się opublikować plików w GitHub Releases."
          }

      - name: Keep every release description version-specific
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem ".\packaging\release-notes\v*.md" | ForEach-Object {
            $tag = $_.BaseName
            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release edit $tag --notes-file $_.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Nie udało się uporządkować opisu wydania $tag."
              }
            }
          }
