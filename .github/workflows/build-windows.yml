name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/build_windows.ps1"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[local,fasttext,video,build]"

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Build application and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipDependencyInstall

      - name: Smoke-test unpacked executable
        shell: pwsh
        run: |
          foreach ($argument in @("--version", "--self-test-video")) {
            $process = Start-Process `
              -FilePath ".\dist\PolySubTranslator\PolySubTranslator.exe" `
              -ArgumentList $argument `
              -PassThru `
              -Wait
            if ($process.ExitCode -ne 0) {
              throw "Test $argument zakończył się kodem $($process.ExitCode)."
            }
          }

      - name: Install, test and uninstall Setup.exe
        shell: pwsh
        run: |
          $installer = (Resolve-Path ".\installer-output\PolySub-Translator-Setup.exe").Path
          $installDir = Join-Path `
            $env:RUNNER_TEMP `
            ("PolySub-Install-Test-" + [guid]::NewGuid().ToString("N"))
          $installArguments = `
            "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$installDir`""
          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList $installArguments `
            -PassThru `
            -Wait
          if ($install.ExitCode -ne 0) {
            throw "Instalator zakończył się kodem $($install.ExitCode)."
          }

          $installedExe = Join-Path $installDir "PolySubTranslator.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Instalator nie utworzył PolySubTranslator.exe."
          }
          foreach ($argument in @("--version", "--self-test-video")) {
            $process = Start-Process `
              -FilePath $installedExe `
              -ArgumentList $argument `
              -PassThru `
              -Wait
            if ($process.ExitCode -ne 0) {
              throw "Zainstalowany program: test $argument zakończył się kodem $($process.ExitCode)."
            }
          }

          $uninstaller = Get-ChildItem `
            -Path $installDir `
            -Filter "unins*.exe" `
            | Select-Object -First 1
          if (-not $uninstaller) {
            throw "Instalator nie utworzył deinstalatora."
          }
          $uninstall = Start-Process `
            -FilePath $uninstaller.FullName `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" `
            -PassThru `
            -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "Deinstalator zakończył się kodem $($uninstall.ExitCode)."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ".\dist\PolySubTranslator" `
            -DestinationPath ".\installer-output\PolySub-Translator-Portable.zip"

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = python -c `
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Nie udało się odczytać wersji aplikacji."
          }
          "POLYSUB_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          $releaseFiles = @(
            ".\installer-output\PolySub-Translator-Setup.exe",
            ".\installer-output\PolySub-Translator-Portable.zip"
          )
          $hashes = foreach ($file in $releaseFiles) {
            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($hash.Path))"
          }
          $hashes | Set-Content `
            -Path ".\installer-output\SHA256SUMS.txt" `
            -Encoding ascii

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: PolySub-Translator-Windows
          path: |
            installer-output/PolySub-Translator-Setup.exe
            installer-output/PolySub-Translator-Portable.zip
            installer-output/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish direct downloads in GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:POLYSUB_VERSION"
          $assets = @(
            ".\installer-output\PolySub-Translator-Setup.exe",
            ".\installer-output\PolySub-Translator-Portable.zip",
            ".\installer-output\SHA256SUMS.txt"
          )

          gh release view $tag --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create `
              $tag `
              $assets `
              --target $env:GITHUB_SHA `
              --title "PolySub Translator $env:POLYSUB_VERSION" `
              --notes-file ".\packaging\RELEASE_NOTES.md" `
              --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Nie udało się opublikować plików w GitHub Releases."
          }
