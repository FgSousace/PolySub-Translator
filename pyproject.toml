[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polysub-translator"
version = "0.5.5"
description = "Context-aware multilingual subtitle translator with automatic language detection and interactive review."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fgSousace" }]
keywords = ["subtitles", "srt", "translation", "multilingual", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "langdetect>=1.0.9,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
local = [
  "huggingface-hub>=0.25,<2",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.11,<2.13",
  "transformers>=4.44,<6",
]
fasttext = ["fasttext-wheel>=0.9.2,<1"]
video = [
  "faster-whisper>=1.2.1,<2",
  "imageio-ffmpeg>=0.6,<1",
]
build = ["pyinstaller>=6.21,<7"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
polysub = "polysub.cli:main"
polysub-gui = "polysub.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
